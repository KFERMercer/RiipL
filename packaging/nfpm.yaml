# Package definition for nfpm (https://github.com/goreleaser/nfpm).

name: riipl
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
version_schema: none
section: utils
priority: optional
maintainer: KFERMercer <KFER.Mercer@gmail.com>
vendor: KFERMercer
homepage: https://github.com/KFERMercer/RiipL
license: GPL-3.0-or-later
description: |
  RiipL Translator: Your local DeepL ripoff.

contents:
  - src: "${RIIPL_BIN}"
    dst: /usr/bin/riipl
    expand: true
    file_info:
      mode: 0755
  - src: "${RIIPL_DESKTOP}"
    dst: /usr/share/applications/riipl.desktop
    expand: true
    file_info:
      mode: 0644
  - src: "${RIIPL_ICON}"
    dst: /usr/share/icons/hicolor/scalable/apps/riipl.svg
    expand: true
    file_info:
      mode: 0644

  - src: "${RIIPL_LICENSE}"
    dst: /usr/share/doc/riipl/copyright
    expand: true
    packager: deb
    file_info:
      mode: 0644
  - src: "${RIIPL_LICENSE}"
    dst: /usr/share/licenses/riipl/LICENSE
    expand: true
    packager: rpm
    file_info:
      mode: 0644
  - src: "${RIIPL_LICENSE}"
    dst: /usr/share/licenses/riipl/LICENSE
    expand: true
    packager: archlinux
    file_info:
      mode: 0644

deb:
  compression: xz

archlinux:
  packager: KFERMercer <KFER.Mercer@gmail.com>

overrides:
  deb:
    depends:
      - libqt6network6 (>= 6.8)
      - libqt6widgets6 (>= 6.8)
      - qt6-svg-plugins
  # Fedora naming; openSUSE users need the libQt6* names instead.
  rpm:
    depends:
      - qt6-qtbase >= 6.8
      - qt6-qtsvg
  archlinux:
    depends:
      - hicolor-icon-theme
      - qt6-base
      - qt6-svg
